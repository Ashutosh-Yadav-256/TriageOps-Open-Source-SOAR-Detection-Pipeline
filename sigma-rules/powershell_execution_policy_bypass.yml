title: PowerShell Execution Policy Bypass
id: 1f0e4b16-56ef-46c5-be33-cbcc59b85dbb
status: test
description: Detects execution policy bypass via command line arguments or cmdlets.
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/techniques/T1562/
author: SOAR Detection Engineering
date: 2024/08/10
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense_evasion
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_bypass:
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - '-ep bypass'
            - '-exec bypass'
            - 'Set-ExecutionPolicy Unrestricted'
            - 'Set-ExecutionPolicy Bypass'
    condition: selection_img and selection_bypass
falsepositives:
    - Legitimate admin scripts
    - software deployment tools
level: medium
